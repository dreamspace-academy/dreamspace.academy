<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Photograph not yet published">
  <title>Photograph not yet published</title>
  <defs>
    <linearGradient id="ph-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5fc"/>
      <stop offset="1" stop-color="#efe9fa"/>
    </linearGradient>
    <pattern id="ph-comb" width="72" height="62.4" patternUnits="userSpaceOnUse">
      <path d="M18 1.7 L54 1.7 L72 32.9 L54 64.1 L18 64.1 L0 32.9 Z"
            fill="none" stroke="#6c2bd9" stroke-opacity="0.13" stroke-width="1.6"/>
    </pattern>
  </defs>

  <style>
    /* An SVG loaded through &lt;img&gt; sees only the OS preference, never the site's
       theme toggle — which is why the pages inline a component instead. This
       block is here so the file itself is at least not a white card in dark mode. */
    .ph-plate { fill: url(#ph-bg); }
    .ph-ink { fill: #4a1e8c; }
    @media (prefers-color-scheme: dark) {
      .ph-plate { fill: #221a35; }
      .ph-ink { fill: #cbbde8; }
    }
  </style>
  <rect width="800" height="600" class="ph-plate"/>
  <rect width="800" height="600" fill="url(#ph-comb)"/>

  <g transform="translate(400 268)">
    <path d="M-34 -22 h68 a8 8 0 0 1 8 8 v42 a8 8 0 0 1 -8 8 h-68 a8 8 0 0 1 -8 -8 v-42 a8 8 0 0 1 8 -8 z"
          fill="none" stroke="#6c2bd9" stroke-opacity="0.42" stroke-width="3"/>
    <path d="M-12 -22 l6 -10 h12 l6 10" fill="none" stroke="#6c2bd9" stroke-opacity="0.42" stroke-width="3"
          stroke-linejoin="round"/>
    <circle cx="0" cy="7" r="15" fill="none" stroke="#f47a1f" stroke-opacity="0.75" stroke-width="3"/>
  </g>

  <text x="400" y="352" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="21" font-weight="600" class="ph-ink" fill-opacity="0.72">
    Photograph not yet published
  </text>
  <text x="400" y="382" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="16" class="ph-ink" fill-opacity="0.5">
    The activity is documented; the image is still being prepared.
  </text>
</svg>
